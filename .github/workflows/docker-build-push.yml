name: Build and Push Docker Images

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:


env:
  STUDENT_ID: "2400033213"
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  build-and-push:
    name: Build & Push to Docker Hub
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Build and push Backend image
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/parkingsession-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/parkingsession-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 5. Build and push Frontend image
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/parkingsession-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/parkingsession-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 6. Summary
      - name: Print image names
        run: |
          echo "✅ Backend image:  ${{ secrets.DOCKERHUB_USERNAME }}/parkingsession-backend:latest"
          echo "✅ Frontend image: ${{ secrets.DOCKERHUB_USERNAME }}/parkingsession-frontend:latest"
